<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Seção de Contato — Exemplo</title>
  <link rel="stylesheet" href="assets/css/teste.css">
</head>
<body>
  <section class="contact-wrap" aria-label="Área de contato">
    <div class="left">
      <div class="brand">
        <div class="logo">MM</div>
        <div>
          <h2>Fale comigo</h2>
          <p class="lead">Tem um projeto, parceria ou só quer dizer oi? Preencha o formulário e eu responderei o mais rápido possível.</p>
        </div>
      </div>
      <div class="info-list">
        <div class="info-item">📧 <span class="muted">email@seudominio.com</span></div>
        <div class="info-item">📞 <span class="muted">+55 (11) 9 9999-9999</span></div>
        <div class="info-item">📍 <span class="muted">São Paulo, Brasil</span></div>
      </div>
    </div>
    <div class="right">
      <form id="contactForm" novalidate>
        <div class="hp" aria-hidden>
          <label>Não preencha (spam trap)
            <input type="text" name="company" tabindex="-1" autocomplete="off">
          </label>
        </div>
        <div class="row">
          <div class="col field">
            <label for="name">Seu nome</label>
            <input id="name" name="name" type="text" placeholder="Ex: Maria Silva" required>
          </div>
          <div class="col field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="seu@email.com" required>
          </div>
        </div>
        <div class="field">
          <label for="subject">Assunto</label>
          <input id="subject" name="subject" type="text" placeholder="Sobre o que é?" required>
        </div>
        <div class="field">
          <label for="message">Mensagem</label>
          <textarea id="message" name="message" placeholder="Escreva sua mensagem..." required></textarea>
        </div>
        <div class="field">
          <label for="budget">Orçamento aproximado (opcional)</label>
          <select id="budget" name="budget">
            <option value="">— selecione —</option>
            <option value="<1000">Menos de R$1.000</option>
            <option value="1000-5000">R$1.000 — R$5.000</option>
            <option value=">5000">Mais de R$5.000</option>
          </select>
        </div>
        <div class="row" style="align-items:center; margin-top:6px">
          <div class="col muted">Ao enviar você concorda em receber uma resposta por email.</div>
          <div class="actions">
            <button type="submit" id="submitBtn">Enviar mensagem</button>
            <button type="button" id="clearBtn" style="background:transparent; color:var(--muted); font-weight:600;">Limpar</button>
          </div>
        </div>
        <div id="result" style="margin-top:12px"></div>
      </form>
    </div>
  </section>
  <script src="teste.js"></script>
</body>
</html>
